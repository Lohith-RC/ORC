name: OSCC AI Continuous Integration & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-tests:
    name: Backend CI (Pytest & Code Quality)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python Code Quality & Flake8 Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity and style warning check
          flake8 backend/app --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

      - name: Execute Automated Pytest Test Suite with Coverage
        env:
          DATABASE_URL: sqlite:///oralcancer_test.db
          SECRET_KEY: ci_cd_test_secret_key_2026
          CORS_ORIGINS: http://localhost:3000,http://localhost:8000
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app --cov-report=term-missing

  frontend-build-verification:
    name: Frontend CI (Build Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Verify React Production Build
        env:
          CI: false
        run: |
          cd frontend
          npm run build
