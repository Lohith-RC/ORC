name: OSCC AI Continuous Integration & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-tests:
    name: Backend CI (Pytest & Security Scans)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx flake8

      - name: Python Code Quality & Flake8 Linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Execute Automated Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///oralcancer_test.db
          SECRET_KEY: ci_cd_test_secret_key_2026
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-build-verification:
    name: Frontend CI (Build & Static Site Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Verify React Production Build
        env:
          CI: false
        run: |
          cd frontend
          npm run build
