<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Medical Cross Glow Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <!-- Lens Flare Glow -->
    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#E11D48" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F1117" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F43F5E" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Architectural Facet Lines -->
  <path d="M 12 12 L 52 52 M 52 12 L 12 52" stroke="#334155" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Core Diagnostic Glow -->
  <circle cx="32" cy="32" r="18" fill="url(#apertureGlow)" />

  <!-- Clinical Shield Emblem -->
  <path d="M 32 14 C 42 14, 48 18, 48 26 C 48 38, 38 46, 32 50 C 26 46, 16 38, 16 26 C 16 18, 22 14, 32 14 Z" 
        fill="#1E222D" stroke="url(#borderGrad)" stroke-width="2" filter="url(#shadow)" />

  <!-- Precision Diagnostic Cross / Aperture Target -->
  <path d="M 29 24 C 29 22.89 29.89 22 31 22 L 33 22 C 34.11 22 35 22.89 35 24 L 35 29 L 40 29 C 41.11 29 42 29.89 42 31 L 42 33 C 42 34.11 41.11 35 40 35 L 35 35 L 35 40 C 35 41.11 34.11 42 33 42 L 31 42 C 29.89 42 29 41.11 29 40 L 29 35 L 24 35 C 22.89 35 22 34.11 22 33 L 22 31 C 22 29.89 22.89 29 24 29 L 29 29 Z" 
        fill="url(#crossGrad)" />

  <!-- Center Laser Sensor Focal Point -->
  <circle cx="32" cy="32" r="2.5" fill="#E11D48" />
  <circle cx="32" cy="32" r="1" fill="#FFFFFF" />
</svg>
